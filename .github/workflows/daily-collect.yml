name: daily-collect

on:
  schedule:
    # 每天北京时间 09:30 = UTC 01:30
    - cron: '30 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 采集
        run: node scripts/collect.mjs

      - name: 构建
        run: node scripts/build.mjs

      - name: 提交更新
        run: |
          git config user.name "meme-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "今天没有新内容，跳过提交"
          else
            git commit -m "📊 每日采集 $(date -u +%Y-%m-%d)"
            git push
          fi
