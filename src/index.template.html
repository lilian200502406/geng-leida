<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>梗雷达 · 全网爆笑物料每日采集</title>
<meta name="description" content="每日自动采集抖音、B站、知乎、微博、头条等平台的热门搞笑视频与段子，内置六种搞笑创意生成器，支持搜索、筛选与导出。">
<style>
:root{
  --bg:#0d0f14;
  --bg2:#14171f;
  --card:#171b24;
  --card-h:#1d2230;
  --line:#262c3a;
  --line2:#333b4d;
  --tx:#e8ebf2;
  --tx2:#98a2b8;
  --tx3:#6b7488;
  --acc:#ff5c3e;
  --acc2:#ffb020;
  --grn:#3ddc97;
  --blu:#5b9dff;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::selection{background:rgba(255,92,62,.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2b3242;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a4358}

/* ---------- 顶栏 ---------- */
.top{
  position:sticky;top:0;z-index:60;
  background:rgba(13,15,20,.86);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.top-in{
  max-width:1320px;margin:0 auto;padding:0 20px;
  height:60px;display:flex;align-items:center;gap:16px;
}
.logo{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
.logo-mark{
  width:26px;height:26px;border-radius:8px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:grid;place-items:center;font-size:14px;font-weight:700;color:#1a0f08;
}
.logo small{color:var(--tx3);font-size:11px;font-weight:400;letter-spacing:0;margin-left:2px}

.search-wrap{flex:1;max-width:420px;position:relative}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45}
input[type=search],.input,.sel{
  width:100%;height:36px;border-radius:10px;
  background:var(--bg2);border:1px solid var(--line);
  color:var(--tx);font-size:13px;padding:0 12px;outline:none;
  transition:border-color .15s,background .15s;
}
.input[type=search],input[type=search]{padding-left:34px}
input:focus,.sel:focus{border-color:var(--line2);background:#181c26}

.nav{display:flex;gap:4px;margin-left:auto}
.nav button{
  height:34px;padding:0 14px;border-radius:9px;border:1px solid transparent;
  background:transparent;color:var(--tx2);font-size:13px;transition:.15s;
}
.nav button:hover{background:var(--bg2);color:var(--tx)}
.nav button.on{background:var(--card);border-color:var(--line);color:var(--tx)}

/* ---------- 状态条 ---------- */
.statbar{
  max-width:1320px;margin:0 auto;padding:20px 20px 0;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  height:28px;padding:0 11px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);
  font-size:12px;color:var(--tx2);white-space:nowrap;
}
.pill b{color:var(--tx);font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:var(--grn);flex:0 0 auto}
.dot.warn{background:var(--acc2)}
.dot.bad{background:var(--acc)}

/* ---------- 主区 ---------- */
main{max-width:1320px;margin:0 auto;padding:18px 20px 80px}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.chip{
  height:30px;padding:0 13px;border-radius:8px;
  background:transparent;border:1px solid var(--line);
  color:var(--tx2);font-size:12.5px;transition:.15s;
}
.chip:hover{border-color:var(--line2);color:var(--tx)}
.chip.on{background:rgba(255,92,62,.12);border-color:rgba(255,92,62,.45);color:#ff8a72}
.chip .n{opacity:.55;margin-left:5px;font-size:11px}
.sep{width:1px;height:18px;background:var(--line);margin:0 4px}

/* ---------- 卡片网格 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;
  transition:border-color .16s,transform .16s,background .16s;
  position:relative;
}
.card:hover{border-color:var(--line2);background:var(--card-h);transform:translateY(-2px)}
.card-link{display:block;padding:14px 14px 0;flex:1}
.cover{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:9px;overflow:hidden;
  background:var(--bg2);margin-bottom:11px;
}
.cover img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92;transition:.25s}
.card:hover .cover img{opacity:1;transform:scale(1.03)}
.play{
  position:absolute;inset:0;display:grid;place-items:center;
}
.play span{
  width:42px;height:42px;border-radius:50%;
  background:rgba(10,12,16,.62);backdrop-filter:blur(4px);
  border:1px solid rgba(255,255,255,.22);
  display:grid;place-items:center;
}
.play span::after{
  content:"";width:0;height:0;margin-left:2px;
  border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;
}
.dur{
  position:absolute;right:7px;bottom:7px;
  background:rgba(8,10,14,.82);border-radius:5px;padding:1px 6px;
  font-size:11px;color:#dfe4ee;font-variant-numeric:tabular-nums;
}
.card h3{
  font-size:14px;font-weight:500;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:8px;color:var(--tx);
}
.card .desc{
  font-size:12.5px;color:var(--tx3);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:10px;
}
.card-meta{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  padding:10px 14px 12px;margin-top:auto;
  border-top:1px solid var(--line);
  font-size:11.5px;color:var(--tx3);
}
.tagp{
  padding:1px 7px;border-radius:5px;font-size:11px;
  background:rgba(91,157,255,.13);color:#8fbaff;border:1px solid rgba(91,157,255,.22);
}
.tagp.抖音{background:rgba(255,92,62,.13);color:#ff9c85;border-color:rgba(255,92,62,.25)}
.tagp.B站{background:rgba(255,102,153,.13);color:#ff9ec2;border-color:rgba(255,102,153,.24)}
.tagp.知乎{background:rgba(91,157,255,.13);color:#8fbaff;border-color:rgba(91,157,255,.22)}
.tagp.微博{background:rgba(255,176,32,.13);color:#ffc766;border-color:rgba(255,176,32,.24)}
.tagp.头条{background:rgba(255,77,77,.12);color:#ff9b9b;border-color:rgba(255,77,77,.22)}
.tagp.百度{background:rgba(61,220,151,.12);color:#7de9bb;border-color:rgba(61,220,151,.22)}
.tagp.一言{background:rgba(160,140,255,.13);color:#b8aaff;border-color:rgba(160,140,255,.24)}
.heat{
  margin-left:auto;display:inline-flex;align-items:center;gap:4px;
  font-variant-numeric:tabular-nums;color:var(--tx2);
}
.heat i{width:5px;height:5px;border-radius:50%;background:var(--acc);display:inline-block}
.heat.hi{color:#ff9c85}

/* 纯文本卡（段子） */
.card.text-card .body{
  font-size:13.5px;line-height:1.8;color:#d7dce8;
  padding:12px;background:var(--bg2);border-radius:9px;
  border-left:2px solid rgba(255,176,32,.5);
  margin-bottom:11px;
}

/* ---------- 日常热梗（紧凑列表） ---------- */
.hotlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.hotitem{
  display:flex;gap:10px;padding:11px 13px;border-radius:11px;
  background:var(--card);border:1px solid var(--line);
  transition:.15s;align-items:flex-start;
}
.hotitem:hover{background:var(--card-h);border-color:var(--line2)}
.hotitem .rk{
  flex:0 0 22px;height:22px;border-radius:6px;display:grid;place-items:center;
  font-size:11px;font-weight:600;background:var(--bg2);color:var(--tx3);
  font-variant-numeric:tabular-nums;margin-top:1px;
}
.hotitem .rk.top{background:rgba(255,92,62,.16);color:#ff8a72}
.hotitem .tx{font-size:13px;line-height:1.5;color:var(--tx)}
.hotitem .sub{font-size:11.5px;color:var(--tx3);margin-top:3px;display:flex;gap:8px;align-items:center}

/* ---------- 生成器 ---------- */
.gen-head{margin-bottom:18px}
.gen-head h2{font-size:19px;font-weight:600;margin-bottom:5px;letter-spacing:.2px}
.gen-head p{color:var(--tx2);font-size:13px}
.gen-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.gtab{
  padding:9px 14px;border-radius:10px;text-align:left;
  background:var(--card);border:1px solid var(--line);color:var(--tx2);
  transition:.15s;
}
.gtab:hover{border-color:var(--line2);color:var(--tx)}
.gtab.on{background:rgba(255,92,62,.1);border-color:rgba(255,92,62,.4)}
.gtab b{display:block;font-size:13px;font-weight:500;color:var(--tx);margin-bottom:1px}
.gtab.on b{color:#ff8a72}
.gtab i{font-size:11px;font-style:normal;color:var(--tx3)}

.gen-grid{display:grid;grid-template-columns:1fr;gap:14px}
.result{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;
}
.result-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.result-top h3{font-size:16px;font-weight:600;line-height:1.45;flex:1}
.badge{
  flex:0 0 auto;padding:3px 9px;border-radius:6px;font-size:11px;
  background:rgba(255,92,62,.12);color:#ff8a72;border:1px solid rgba(255,92,62,.28);
}
pre.script{
  white-space:pre-wrap;word-break:break-word;
  font-family:inherit;font-size:13.5px;line-height:1.85;color:#cdd4e2;
  background:var(--bg2);border-radius:10px;padding:15px 16px;
  border:1px solid var(--line);
}
.meta-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.meta-row span{
  font-size:11.5px;color:var(--tx2);background:var(--bg2);
  border:1px solid var(--line);border-radius:6px;padding:2px 8px;
}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{
  height:34px;padding:0 15px;border-radius:9px;
  background:linear-gradient(135deg,var(--acc),#ff7a3d);border:none;
  color:#fff;font-size:13px;font-weight:500;transition:.15s;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{
  background:var(--bg2);border:1px solid var(--line);color:var(--tx2);font-weight:400;
}
.btn.ghost:hover{border-color:var(--line2);color:var(--tx)}

.empty{
  text-align:center;padding:70px 20px;color:var(--tx3);
}
.empty b{display:block;font-size:15px;color:var(--tx2);margin-bottom:6px}

/* ---------- 采集日志 ---------- */
.runs{max-width:1320px;margin:0 auto}
.run{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:10px;
}
.run-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.run-h b{font-weight:600}
.run-h .t{color:var(--tx3);font-size:12px;margin-left:auto}
.srclist{display:flex;flex-wrap:wrap;gap:6px}
.src{
  font-size:11.5px;padding:3px 9px;border-radius:6px;
  border:1px solid var(--line);background:var(--bg2);color:var(--tx2);
}
.src.ok{color:#7de9bb;border-color:rgba(61,220,151,.25);background:rgba(61,220,151,.07)}
.src.err{color:#ff9c85;border-color:rgba(255,92,62,.25);background:rgba(255,92,62,.07)}

/* ---------- 底栏 ---------- */
footer{
  border-top:1px solid var(--line);margin-top:40px;
  padding:22px 20px;text-align:center;color:var(--tx3);font-size:12px;
}
footer a{color:var(--tx2)}
footer a:hover{color:var(--acc2)}

.toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,80px);
  background:#222a38;border:1px solid var(--line2);color:var(--tx);
  padding:10px 18px;border-radius:10px;font-size:13px;z-index:200;
  opacity:0;transition:.25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:760px){
  .top-in{height:auto;padding:10px 14px;flex-wrap:wrap;gap:10px}
  .search-wrap{order:3;flex:1 1 100%;max-width:none}
  .nav{margin-left:0}
  main{padding:14px 14px 60px}
  .statbar{padding:14px 14px 0}
  .grid{grid-template-columns:1fr}
  .hotlist{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="logo">
      <div class="logo-mark">梗</div>
      <div>梗雷达<small>MemeRadar</small></div>
    </div>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="搜索标题、描述、话题…  按 / 聚焦" autocomplete="off">
    </div>
    <nav class="nav" id="nav">
      <button data-view="video">搞笑视频</button>
      <button data-view="hotword">热梗</button>
      <button data-view="text">段子</button>
      <button data-view="gen">创意生成器</button>
      <button data-view="runs">采集日志</button>
    </nav>
  </div>
</header>

<div class="statbar" id="statbar"></div>

<main>
  <!-- 素材流 -->
  <section id="view-feed">
    <div class="filters" id="filters"></div>
    <div id="feed"></div>
  </section>

  <!-- 生成器 -->
  <section id="view-gen" hidden>
    <div class="gen-head">
      <h2>搞笑创意生成器</h2>
      <p>本地组合式生成，无需联网、无需密钥。生成的剧本可直接改、直接拍。</p>
    </div>
    <div class="gen-tabs" id="genTabs"></div>
    <div class="gen-grid">
      <div class="result" id="genResult"></div>
    </div>
  </section>

  <!-- 采集日志 -->
  <section id="view-runs" hidden>
    <div class="gen-head">
      <h2>采集日志</h2>
      <p>每次运行时各数据源的状态，失败会自动跳过，不影响整体。</p>
    </div>
    <div class="runs" id="runsBox"></div>
  </section>
</main>

<footer>
  <div>梗雷达 MemeRadar · 数据来自各平台公开接口，仅采集标题与热度指标，版权归原作者所有</div>
  <div style="margin-top:6px" id="footMeta"></div>
</footer>

<div class="toast" id="toast"></div>
